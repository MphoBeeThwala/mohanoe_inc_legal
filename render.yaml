services:
  - type: web
    name: mohanoe-inc-legal # legacy Render service ID; kept until the Azure migration (renaming creates a new service)
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_DATA_RETENTION_DAYS
        value: '3650'
      - key: RATE_LIMIT_WINDOW_MS
        value: '60000'
      - key: RATE_LIMIT_MAX
        value: '240'
      - key: LOG_HTTP
        value: 'true'
      - key: JWT_ISSUER
        value: ahava88-legal-pms
      - key: AUDIT_ANCHOR_INTERVAL_HOURS
        value: '24'
      - key: DEFAULT_FIRM_SLUG
        value: default
      - key: PLATFORM_BASE_DOMAIN
        sync: false
      - key: FIRM_NAME
        sync: false
      - key: FIRM_SHORT_NAME
        sync: false
      - key: FIRM_CASE_PREFIX
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTAKE_ENCRYPTION_KEY
        sync: false
      - key: AUDIT_CHAIN_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
