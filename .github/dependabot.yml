# Weekly dependency updates. Security updates are raised as soon as an advisory
# is published (enable "Dependabot security updates" in the repository settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node runtime in the Dockerfile (22): move both together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Johannesburg
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Johannesburg
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Johannesburg
    ignore:
      # azurerm 5 is a major provider upgrade: plan it on staging deliberately.
      - dependency-name: hashicorp/azurerm
        update-types: ['version-update:semver-major']
